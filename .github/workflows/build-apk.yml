name: Build APK

# Builds the app's APK (arm64-v8a) with scripts/build_sdl3.sh and scripts/build_apk.sh, and keeps it as an artifact.
# Run it by hand (Actions, Build APK, Run workflow) or push to main or a patch/* branch.

on:
  workflow_dispatch:
  push:
    branches: [main, 'patch/**']
    paths-ignore: ['**.md', 'LICENSE', 'ADDITIONAL-TERMS', 'THIRD_PARTY_NOTICES']

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: CMake and Ninja
        run: python -m pip install --upgrade cmake ninja

      - name: Android SDK platform and NDK 27.0.12077973
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "ndk;27.0.12077973" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Cache SDL3
        uses: actions/cache@v4
        with:
          path: build/sdl3/out
          key: sdl3-${{ hashFiles('scripts/build_sdl3.sh', 'scripts/android_env.sh') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # The same signing key every build, so a new APK installs over the last one without uninstalling (and losing saves).
      # With the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS (and
      # ANDROID_KEY_PASSWORD, if it differs) it is your own key. Without them a key is made once and kept in the Actions
      # cache: GitHub drops a cache nobody used for 7 days, and then the next build makes a new key.
      - name: Restore the generated signing key
        uses: actions/cache@v4
        with:
          path: android/mh4u.keystore
          key: mh4u-signing-key-v1

      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          cd android
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > mh4u.keystore
            printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KS_ALIAS" "${KS_KEYPASS:-$KS_PASS}" > keystore.properties
            echo "SIGNING=your own key (repository secrets)" >> "$GITHUB_ENV"
          else
            if [ -f mh4u.keystore ]; then
              echo "SIGNING=generated key restored from the cache" >> "$GITHUB_ENV"
            else
              keytool -genkeypair -keystore mh4u.keystore -storepass android -keypass android -alias mh4u \
                -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=MH4U fork build"
              echo "SIGNING=new generated key (kept in the cache from now on)" >> "$GITHUB_ENV"
            fi
            printf 'storePassword=android\nkeyAlias=mh4u\nkeyPassword=android\n' > keystore.properties
          fi

      - name: Build SDL3
        run: bash scripts/build_sdl3.sh

      - name: Build the APK
        run: bash scripts/build_apk.sh

      - name: Collect the APK
        run: |
          set -e
          mkdir -p out
          APK=$(ls android/app/build/outputs/apk/release/*.apk android/app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)
          [ -n "$APK" ] || { echo "No APK was built" >&2; exit 1; }
          NAME="MH4U-$(cat VERSION)-${GITHUB_SHA::7}.apk"
          cp "$APK" "out/$NAME"
          {
            echo "### $NAME"
            echo "- signed with: $SIGNING"
            echo "- size: $(du -h "out/$NAME" | cut -f1)"
            echo "- SHA-256: \`$(sha256sum "out/$NAME" | cut -d' ' -f1)\`"
            echo "- certificate:"
            echo '```'
            BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
            "${BT}apksigner" verify --print-certs "out/$NAME" 2>&1 | head -n 4 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: MH4U-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
